version: "2.4"
services:
  mongodb-helix-mep:
    image: mongo:latest
    restart: always
    container_name: mongodb-helix-mep
    environment:
      MONGO_INITDB_ROOT_USERNAME: andrair
      MONGO_INITDB_ROOT_PASSWORD: 1234
    ports:
      - "27023:27017" # Para acceder a MongoDB desde tu máquina local
    volumes:
      - mongodb_data_mep:/data/db
    networks:
      - ms-helix-network

  # Redis propio de esta organización, solo para el gateway de rate-limit
  # hacia Meraki (BullMQ). No se comparte con las otras 6 organizaciones ni
  # con la infraestructura de Epistech -- cada organización mantiene su
  # stack aislado, igual que ya pasa con mongodb-helix-mep.
  redis-helix-mep:
    image: redis:7-alpine
    restart: always
    container_name: redis-helix-mep
    ports:
      - "6380:6379" # Para acceder a Redis desde tu máquina local
    networks:
      - ms-helix-network

  ms-helix-mep:
    build:
      context: ./
    container_name: ms-helix-mep
    #mem_limit: 12g
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis-helix-mep:6379
    ports:
      - "3005:3005"
    depends_on:
      - mongodb-helix-mep
      - redis-helix-mep
    networks:
      - ms-helix-network
    command: node --max-old-space-size=10240 build/index.js

networks:
  ms-helix-network:
    driver: bridge

volumes:
  mongodb_data_mep:
