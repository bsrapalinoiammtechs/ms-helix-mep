version: "2.4"

# Parametrizado por organización vía .env (ORG_SLUG, HTTP_PORT,
# MONGO_LOCAL_PORT, REDIS_LOCAL_PORT) -- ver .env.example. Los nombres de
# servicio (claves de este YAML: mongodb-helix, redis-helix, ms-helix) se
# dejan fijos a propósito -- Docker Compose namespacea automáticamente por
# carpeta/proyecto (por eso cada organización ya vive en su propia
# carpeta), así que no hace falta variarlos para evitar colisiones. Lo
# único que SÍ debe ser único por organización es `container_name` (no se
# namespacea solo, es justo lo que causó el choque de nombres al mover la
# canario de mep a otra carpeta) y los puertos publicados al host (todas
# las organizaciones comparten el mismo host).
services:
  mongodb-helix:
    image: mongo:latest
    restart: always
    container_name: mongodb-helix-${ORG_SLUG}
    environment:
      MONGO_INITDB_ROOT_USERNAME: andrair
      MONGO_INITDB_ROOT_PASSWORD: 1234
    ports:
      - "${MONGO_LOCAL_PORT}:27017" # Para acceder a MongoDB desde tu máquina local
    volumes:
      - mongodb_data:/data/db # ver bloque `volumes:` al final -- nombre real fijado por MONGO_VOLUME_NAME
    networks:
      - ms-helix-network

  # Redis propio de esta organización, solo para el gateway de rate-limit
  # hacia Meraki (BullMQ). No se comparte con las otras organizaciones ni
  # con la infraestructura de Epistech -- cada organización mantiene su
  # stack aislado, igual que ya pasa con mongodb-helix.
  redis-helix:
    image: redis:7-alpine
    restart: always
    container_name: redis-helix-${ORG_SLUG}
    ports:
      - "${REDIS_LOCAL_PORT}:6379" # Para acceder a Redis desde tu máquina local
    networks:
      - ms-helix-network

  ms-helix:
    build:
      context: ./
    container_name: ms-helix-${ORG_SLUG}
    #mem_limit: 12g
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis-helix-${ORG_SLUG}:6379
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
    depends_on:
      - mongodb-helix
      - redis-helix
    networks:
      - ms-helix-network
    command: node --max-old-space-size=10240 build/index.js

networks:
  ms-helix-network:
    driver: bridge

volumes:
  # `name:` explícito a propósito: sin esto, Docker Compose calcula el
  # nombre real del volumen como <carpeta-del-proyecto>_mongodb_data. Si la
  # clave de este YAML cambia (como pasó hoy al parametrizar) o la carpeta
  # cambia (como pasó con el canario de mep), ese cálculo da un nombre
  # DISTINTO y Docker crea un volumen nuevo vacío -- exactamente los dos
  # incidentes de datos de hoy (2026-08-24, ver Fase D.1 y D.6 en
  # 01_FIX_ALERTAS_RETENIDAS...md). Con `name:` fijo, apunta siempre al
  # volumen real existente sin importar de qué carpeta/clave se despliegue.
  mongodb_data:
    name: ${MONGO_VOLUME_NAME}
